name: release

# Publishes agentcurfew from a version tag, in two gates: the GitHub environment npm needs the maintainer's approval, and
# the package is staged on npm, where it goes live only after npm stage approve with 2FA. No npm token is stored: the
# publish job authenticates with OIDC (trusted publishing). See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NPM: npx --yes npm@11.21.1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi
          if [ "$version" = "0.0.0" ]; then echo "::error::0.0.0 is the unreleased version"; exit 1; fi
      - run: $NPM ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:pkg
      - id: pack
        run: |
          tarball="$($NPM pack --ignore-scripts --silent)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed \`$tarball\`, SHA-256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: The tarball is the one that was tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check
      - name: Stage on npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          $NPM stage publish "./$TARBALL" --access public
          echo "Staged \`$TARBALL\`. It goes live after \`npm stage approve <id>\` (or Approve on npmjs.com) with 2FA; \`npm stage list agentcurfew\` shows the id." >> "$GITHUB_STEP_SUMMARY"
