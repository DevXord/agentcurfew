name: release

# Publishes agentcurfew from a version tag, in two gates: the GitHub environment npm needs the maintainer's approval, and
# the package is staged on npm, where it goes live only after npm stage approve with 2FA. No npm token is stored: the
# publish job authenticates with OIDC (trusted publishing). See docs/RELEASING.md.
#
# workflow_dispatch runs build, tarball-install and tarball-smoke as a dry run of the release gates, without publishing. GitHub only
# dispatches workflows that live on the default branch, so the dry run runs after the merge to main and before the tag.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch: {}

permissions: {}

env:
  NPM: npx --yes npm@11.21.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Needed for the merge-base gate below.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: version
        name: Resolve the package version
        env:
          REF: ${{ github.ref }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$REF" == refs/tags/* ]]; then
            tag="${REF#refs/tags/}"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::tag $tag does not match v<major>.<minor>.<patch>"; exit 1; fi
            if [ "$tag" != "v$version" ]; then echo "::error::tag $tag does not match package.json version $version"; exit 1; fi
            if [ "$version" = "0.0.0" ]; then echo "::error::0.0.0 is the unreleased version"; exit 1; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: HEAD is an ancestor of origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::HEAD is not an ancestor of origin/main; only commits on main can be released"
            exit 1
          fi
      - name: CHANGELOG has the release section and [Unreleased] is empty
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          first="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')"
          if [ "$first" != "$VERSION" ]; then
            echo "::error::first release heading in CHANGELOG.md is '## $first', expected '## $VERSION'"; exit 1
          fi
          # Fail if anything non-blank sits between the [Unreleased] heading and the next heading.
          awk '
            /^## \[Unreleased\]/ { flag = 1; next }
            /^## / { flag = 0 }
            flag && NF { print; found = 1 }
            END { exit found ? 1 : 0 }
          ' CHANGELOG.md || { echo "::error::CHANGELOG.md [Unreleased] section is not empty"; exit 1; }
      - run: $NPM ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:pkg
      - run: npm run fuzz
      - name: Self-check the built CLI
        run: |
          node dist/cli.js scan .
          node dist/cli.js verify .
          node dist/cli.js doctor .
      - name: Imports of dist/*.js stay on the allowlist
        run: node scripts/check-imports.mjs
      - id: pack
        run: |
          tarball="$($NPM pack --ignore-scripts --silent)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed \`$tarball\`, SHA-256 \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          retention-days: 7

  tarball-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Installed once with the pinned npm, outside the project, as a user would install the package (the project's
      # .npmrc allow-file=none does not apply there). The Node.js matrix below only runs the installed CLI, so no job
      # installs with the npm that an old Node.js bundles, which lacks the settings of the project's .npmrc.
      - name: Install the tarball outside the project
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          dir="$RUNNER_TEMP/tarball-install"
          mkdir -p "$dir"
          echo '{"private":true}' > "$dir/package.json"
          cp "$TARBALL" "$dir/"
          (cd "$dir" && $NPM install --ignore-scripts --no-audit --no-fund --no-save "./$(basename "$TARBALL")")
          echo "dir=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed
          path: ${{ env.dir }}/node_modules
          retention-days: 7

  tarball-smoke:
    needs: tarball-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 20.0.0 is the floor in engines (D-037); the others are the newest release of each line.
        node: ['20.0.0', '20', '22', '24', '26']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installed
          path: ${{ runner.temp }}/installed/node_modules
      - name: Smoke-test the installed package
        run: scripts/smoke.sh "$RUNNER_TEMP/installed/node_modules/agentcurfew/dist/cli.js"

  publish:
    needs: [build, tarball-smoke]
    # workflow_dispatch exercises build, tarball-install and tarball-smoke only; a tag push is the only path that reaches publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The bundled npm is recent enough for staged publish (≥ 11.15)
        run: npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: The tarball is the one that was tested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $TARBALL" | sha256sum --check
      - name: Stage on npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          npm stage publish "./$TARBALL" --access public
          echo "Staged \`$TARBALL\`. It goes live after \`npm stage approve <id>\` (or Approve on npmjs.com) with 2FA; \`npm stage list agentcurfew\` shows the id." >> "$GITHUB_STEP_SUMMARY"
