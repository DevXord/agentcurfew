name: action-test

# Runs the action of this repository on its own fixtures. It reads only; nothing is uploaded.
on:
  push:
    branches: [main-wopcok]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - id: findings
        name: scan finds a plain-HTTP MCP server
        uses: ./
        continue-on-error: true
        with:
          directory: tests/fixtures/rules/plain-http-mcp/positive
          sarif-file: findings.sarif

      - id: clean
        name: scan passes an empty project
        uses: ./
        with:
          directory: tests/fixtures/repos/empty
          sarif-file: clean.sarif

      - id: verify
        name: verify fails without a lock
        uses: ./
        continue-on-error: true
        with:
          command: verify
          directory: tests/fixtures/repos/empty

      - id: doctor
        name: doctor passes a working configuration
        uses: ./
        with:
          command: doctor
          directory: tests/fixtures/repos/claude-basic

      - name: Check the results
        env:
          FINDINGS: ${{ steps.findings.outputs.exit-code }}
          CLEAN: ${{ steps.clean.outputs.exit-code }}
          VERIFY: ${{ steps.verify.outputs.exit-code }}
          DOCTOR: ${{ steps.doctor.outputs.exit-code }}
        run: |
          set -eu
          echo "findings=$FINDINGS clean=$CLEAN verify=$VERIFY doctor=$DOCTOR"
          test "$FINDINGS" = 1
          test "$CLEAN" = 0
          test "$VERIFY" = 1
          test "$DOCTOR" = 0
          node -e '
            const fs = require("fs");
            const findings = JSON.parse(fs.readFileSync("findings.sarif", "utf8"));
            const clean = JSON.parse(fs.readFileSync("clean.sarif", "utf8"));
            if (findings.version !== "2.1.0" || !findings.runs[0].results.some((r) => r.ruleId === "plain-http-mcp")) process.exit(1);
            if (clean.runs[0].results.length !== 0) process.exit(1);
            console.log("SARIF as expected");
          '
